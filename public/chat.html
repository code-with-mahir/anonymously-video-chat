<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>Talkoye.com - Anonymous Video Chat</title>

        <link rel="stylesheet" href="css/chat.css?v=1.1" />

        <!-- Google Ad -->
        <script
            async
            src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5445276985326779"
            crossorigin="anonymous"></script>
    </head>
    <body>
        <!-- FIRST TIME GENDER MODAL -->
        <div id="genderModal" class="custom-modal">
            <div class="modal-content">
                <h3>Welcome to Talkoye! 👋</h3>
                <p>Please select your gender to continue:</p>
                <div class="modal-buttons">
                    <button class="btn btn-primary" onclick="saveMyGender('Male')">👨 Male</button>
                    <button class="btn btn-primary" onclick="saveMyGender('Female')">👩 Female</button>
                </div>
            </div>
        </div>

        <header class="header">
            <div class="logo">
                <a href="https://yourlink.com" class="logo-text">
                    <span class="span-1">talk</span><span class="span-2">oye</span
                    ><span class="span-3">.com</span>
                </a>
            </div>
            <div class="stats">
                <div class="pulse-dot"></div>
                <span id="onlineCount">0</span> online
            </div>
        </header>

        <main class="main-container">
            <section class="video-section">
                <div class="video-grid">
                    <div class="video-wrapper" id="remoteVideoContainer">
                        <video id="remoteVideo" autoplay playsinline></video>
                        <div class="video-label">Stranger</div>
                        <div class="waiting-message" id="waitingMessage">
                            Click "Start Chat" to find a match
                        </div>
                        <div class="video-logo">
                            <div class="logo-text">
                                <span class="span-1">talk</span><span class="span-2">oye</span
                                ><span class="span-3">.com</span>
                            </div>
                        </div>
                    </div>
                    <div class="video-wrapper">
                        <video id="localVideo" autoplay playsinline muted></video>
                        <div class="video-label">You</div>
                        <div class="video-logo">
                            <div class="logo-text">
                                <span class="span-1">talk</span><span class="span-2">oye</span
                                ><span class="span-3">.com</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <div class="chat-control">
                <div class="controls-panel">
                    <div class="status-container">
                        Status:
                        <span id="statusText" class="status-text status-idle">Disconnected</span>
                    </div>
                    <!-- Keyword Input Section -->
<div class="input-group">
    <!-- Naya fake input wrapper jo tags aur input dono ko hold karega -->
    <div class="fake-input-wrapper" id="fakeInputWrapper" onclick="document.getElementById('keywordInput').focus()">
        <div class="keyword-tags" id="keywordTagsContainer"></div>
        <input
            type="text"
            id="keywordInput"
            placeholder="Add interest (e.g., music)"
            maxlength="30" />
    </div>
    <button class="btn btn-secondary" id="addKeywordBtn" type="button">
        Add
    </button>
</div>
                    <div class="action-buttons">
                        <button class="btn btn-start" id="startBtn">Start Chat</button>
                        <button class="btn btn-stop" id="stopBtn" disabled>Stop</button>
                    </div>
                    <!-- NEW: Country and Gender Preferences -->
                    <div class="filters-group">
                       <!-- Custom Dropdown UI -->
                        <div class="custom-select-wrapper" id="customCountrySelect">
                            <div class="custom-select-trigger">
                                <span id="selectedCountryContent">🌍 All Countries</span>
                                <span class="arrow">▼</span>
                            </div>
                            <div class="custom-options" id="countryOptionsList">
                                <!-- JS se options yahan aayenge -->
                            </div>
                        </div>
                        <!-- Hidden input backend search data ke liye -->
                        <input type="hidden" id="prefCountry" value="ALL">

                       <!-- Hidden input: Yeh ensure karega ki aapka purana JS code document.getElementById('prefGender').value perfectly kaam kare -->
                       <input type="hidden" id="prefGender" value="Both">

                        <!-- Custom UI: Jispar aapki purani .filter-select class lagi hai -->
                        <div class="filter-select custom-gender-wrapper" id="customGenderSelect" tabindex="0">
                            <div class="custom-gender-trigger">

                                <span id="selectedGenderContent" style="display: flex; align-items: center; gap: 8px;">

                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-input-panel">
                        <div class="input-group">
                            <input
                                type="text"
                                id="messageInput"
                                placeholder="Type a message..."
                                disabled
                                autocomplete="off" />
